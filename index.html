<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>How to read more efficiently</title>
<style>
  body{background:#041022;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#fff;user-select:none}
  #ui{position:fixed;top:10px;left:10px;z-index:10}
  button{padding:6px 12px;margin-right:8px;font-size:14px;border-radius:6px;border:0;background:#184;color:#fff;cursor:pointer}
  #levelDisplay{font-size:16px;margin-left:12px}
  #message{display:inline-block;margin-left:16px;color:#ffd}
  canvas{display:block;margin:0 auto;border-radius:8px;background:linear-gradient(#041022,#082532)}
</style>
</head>
<body>
<div id="ui">
  <button id="restartG">Restart</button>
  <button id="toggleDebugG">Debug</button>
  <span id="levelDisplay">Level 1</span>
  <span style="margin-left:12px">Score: <span id="scoreG">0</span></span>
  <span id="message"></span>
</div>
<canvas id="canvasGravity" width="1000" height="600"></canvas>
<div id="countdownOverlay" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); font-size:120px; font-weight:bold; color:#fff; text-shadow: 0 0 20px rgba(0,0,0,0.5); pointer-events:none; z-index:100; display:none;"></div>
<script>
(() => {
  const canvas = document.getElementById('canvasGravity');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Config
  const baseLevelLength = 3000;
  const STROKE_LIFE = 3.5;
  const STROKE_RADIUS = 120;

  let countdown = 0;
  let isCountingDown = false;
  const overlay = document.getElementById('countdownOverlay');
  // State
  let debug = false;
  let level = 1;
  let levelLength = Math.floor(baseLevelLength * Math.pow(1.2, level-1));
  let completedOffset = 0; // world x offset of completed levels

  let strokes = []; // world-coordinate strokes
  let platforms = []; // world-coordinate platforms
  let spikes = [];
  let ceilingSpikes = [];

  let player = { x:120, y:300, vx:220, vy:0, radius:12, grounded:false };
  let running = true;
  let loopActive = false;
  let lastT = performance.now()/1000;

  const scoreEl = document.getElementById('scoreG');
  const levelEl = document.getElementById('levelDisplay');
  const msgEl = document.getElementById('message');

  function generateLevel(startX){

    ceilingSpikes = [];

    // ground
    platforms.push({ x: startX + 0, y: 520, w: Math.max(980, Math.min(1200, levelLength>980?980:levelLength)), h:80 });

    let xPos = startX + 300;
    const endX = startX + levelLength;

    while(xPos < endX){
      const y = 80 + Math.random() * 400;
      const w = 80 + Math.random() * 160;
      platforms.push({ x: xPos, y: y, w: w, h: 14 });
      if(Math.random() < 0.8-0.8/level) {
        spikes.push({ x: xPos + Math.random() * Math.max(10,w-10), y: y - 18, w: 30, h: 18 });
      }
      xPos += -12*level*level + 96*level
    }

    if (level > 8){
      level = "..........................................  You Win!!!!!!!!!!!!!"
      running = false
    }

    // ceiling spikes across level
    for(let sx = startX; sx < startX + levelLength; sx += 20){
      ceilingSpikes.push({ x: sx, y: 0, w: 20, h: 20 });
    }
  }

  function startLevel(lv) {
    level = lv;
    levelLength = Math.floor(baseLevelLength * Math.pow(1.06, level - 1));
    levelEl.textContent = `Level ${level}`;
    
    // Clear old level data
    platforms = [];
    spikes = [];
    strokes = [];
    
    generateLevel(completedOffset);

    // Setup Countdown
    isCountingDown = true;
    countdown = 3;
    overlay.style.display = 'block';
    overlay.textContent = countdown;
    
    let timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        overlay.textContent = countdown;
      } else if (countdown === 0) {
        overlay.textContent = "GO!";
      } else {
        clearInterval(timer);
        overlay.style.display = 'none';
        isCountingDown = false; // This releases the physics loop
      }
    }, 800); // 800ms feels snappier than a full second
  }

  function nextLevel() {
    completedOffset += levelLength;
    startLevel(level + 1);
    
    player.x = completedOffset + 120;
    player.y = 300;
    player.vx = 220;
    player.vy = 0;
  }

  function reset(full=true){
    running = true;
    lastT = performance.now()/1000;
    msgEl.textContent = '';
    if(full){
      level = 1; completedOffset = 0;
      startLevel(level);
      player.x = completedOffset + 120;
    } else {
      // restart current level
      startLevel(level);
      player.x = completedOffset + 120;
    }
    player.y = 300; player.vx = 220; player.vy = 0; player.grounded = false;
    updateScore();
    if(!loopActive){
      loopActive = true;
      requestAnimationFrame(step);
    }
  }

  reset(true);

  // Input: convert clicks to world coords (account for camera)
  function getCamX(){ return Math.max(0, player.x - 200); }
  function pointerWorld(e){ const r = canvas.getBoundingClientRect(); const camX = getCamX(); return { x: (e.clientX - r.left) + camX, y: (e.clientY - r.top) }; }

  let drawing = false; let drawStart = null;
  canvas.addEventListener('mousedown', e => { drawing = true; drawStart = pointerWorld(e); });
  canvas.addEventListener('mouseup', e => {
    if(!drawing) return; drawing = false; const end = pointerWorld(e); const now = performance.now()/1000; strokes.push({ x1: drawStart.x, y1: drawStart.y, x2: end.x, y2: end.y, t: now, d: STROKE_LIFE });
  });

  // Buttons
  document.getElementById('restartG').addEventListener('click', ()=>reset(true));
  document.getElementById('toggleDebugG').addEventListener('click', ()=>{ debug = !debug; msgEl.textContent = debug ? 'DEBUG ON' : ''; });

  // Physics helpers
  function linePointDist(x1,y1,x2,y2,px,py){
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A*C + B*D; const len_sq = C*C + D*D; let param = -1; if(len_sq !== 0) param = dot / len_sq;
    let xx, yy;
    if(param < 0){ xx = x1; yy = y1; }
    else if(param > 1){ xx = x2; yy = y2; }
    else { xx = x1 + param * C; yy = y1 + param * D; }
    const dx = px - xx, dy = py - yy; return { dist: Math.hypot(dx,dy), nx: dx, ny: dy, projParam: param, px: xx, py: yy };
  }
  function normalize(vx,vy){ const L = Math.hypot(vx,vy) || 1; return { x: vx / L, y: vy / L }; }

  function computeLocalGravity(px,py){
    let gx = 0, gy = 600; let best = null, bestStrength = 0; const now = performance.now()/1000;
    for(const s of strokes){
      const info = linePointDist(s.x1,s.y1,s.x2,s.y2,px,py);
      if(info.dist <= STROKE_RADIUS){ const age = now - s.t; if(age > s.d) continue; const ageFactor = 1 - (age / s.d); const distFactor = 1 - (info.dist / STROKE_RADIUS); const strength = ageFactor * distFactor; if(strength > bestStrength){ bestStrength = strength; best = { s, info }; } }
    }
    if(best){ const sx = best.s.x2 - best.s.x1, sy = best.s.y2 - best.s.y1; const sv = normalize(sx,sy); const gx_u = -sv.y, gy_u = sv.x; const midx = (best.s.x1 + best.s.x2)/2, midy = (best.s.y1 + best.s.y2)/2; const toPlayerX = px - midx, toPlayerY = py - midy; const sign = (toPlayerX*gx_u + toPlayerY*gy_u) >= 0 ? 1 : -1; const mag = 800 * Math.max(0.2, bestStrength); gx = gx_u * mag * sign; gy = gy_u * mag * sign; }
    return { gx, gy };
  }

  function rectCollide(px,py,r,rect){ const nearestX = Math.max(rect.x, Math.min(px, rect.x + rect.w)); const nearestY = Math.max(rect.y, Math.min(py, rect.y + rect.h)); return Math.hypot(px - nearestX, py - nearestY) <= r; }

  function updateScore(){ scoreEl.textContent = Math.floor(player.x / 10); }

  function nextLevel(){
    // advance offsets so world coords remain absolute
    completedOffset += levelLength;
    level++;
    levelLength = Math.floor(baseLevelLength * Math.pow(1.5, level-1));
    levelEl.textContent = `Level ${level}`;
    generateLevel(completedOffset);
    // place player at start of new level (absolute coords)
    player.x = completedOffset + 120; player.y = 300; player.vx = 220; player.vy = 0; strokes = [];
    msgEl.textContent = `Welcome to level ${level}`;
    setTimeout(()=>{ msgEl.textContent = ''; }, 1200);
  }

  function step() {
      const now = performance.now() / 1000;
      let dt = Math.min(0.034, now - lastT);
      lastT = now;
      
      if (!running) {
        loopActive = false;
        return;
      }

      // If counting down, just render and wait
      if (isCountingDown) {
        render(Math.max(0, player.x - 200));
        requestAnimationFrame(step);
        return; 
      }

      // --- Physics Resume ---
      const g = computeLocalGravity(player.x, player.y);
      player.vx += g.gx * dt; 
      player.vy += g.gy * dt;
      player.x += player.vx * dt; 
      player.y += player.vy * dt; 
      player.grounded = false;



      // collisions with platforms
      for(const p of platforms){ if(rectCollide(player.x, player.y, player.radius, p)){ if(player.y < p.y){ player.y = p.y - player.radius - 0.1; player.vy = Math.min(0, player.vy); player.grounded = true; } else { if(player.x < p.x + p.w/2) player.x = p.x - player.radius - 0.1; else player.x = p.x + p.w + player.radius + 0.1; player.vx = Math.min(player.vx, 600); } } }

      // collisions with spikes
      for(const s of spikes){ if(rectCollide(player.x-9, player.y, player.radius, s)){ running = false; loopActive = false; msgEl.textContent = 'You crashed! Press Restart.'; return; } }
      for(const c of ceilingSpikes){ if(rectCollide(player.x, player.y, player.radius, c)){ running = false; loopActive = false; msgEl.textContent = 'You hit the ceiling! Press Restart.'; return; } }

      // fell off
      if(player.y > H + 50){ running = false; loopActive = false; msgEl.textContent = 'You fell off! Press Restart.'; return; }


      // Level complete check
      if (player.x >= completedOffset + levelLength) {
        nextLevel();
      }
      updateScore();

      const camX = Math.max(0, player.x - 200);
      render(camX);
      requestAnimationFrame(step);
    }

  function render(camX){
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(-camX, 0);

    // background
    const g = ctx.createLinearGradient(camX,0,camX+W,0); g.addColorStop(0,'#041022'); g.addColorStop(1,'#073478'); ctx.fillStyle = g; ctx.fillRect(camX,0,W,H);

    // ceiling spikes
    ctx.fillStyle = '#b33';
    for(const c of ceilingSpikes){ if(c.x + 40 < camX || c.x > camX + W) continue; ctx.beginPath(); ctx.moveTo(c.x, c.y + 20); ctx.lineTo(c.x + 10, c.y); ctx.lineTo(c.x + 20, c.y + 20); ctx.fill(); }

    // strokes
    for(const s of strokes){ const age = (performance.now()/1000 - s.t) / s.d; const alpha = Math.max(0, 1 - age); ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.lineWidth = 6; ctx.strokeStyle = `rgba(255,200,120,${0.18 * alpha})`; ctx.stroke(); ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,240,180,${0.9 * alpha})`; ctx.stroke(); }

    // platforms
    for(const p of platforms){ if(p.x + p.w < camX || p.x > camX + W) continue; ctx.fillStyle = '#2b6'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeStyle = '#173'; ctx.strokeRect(p.x, p.y, p.w, p.h); }

    // Draw Finish Line
    const finishX = completedOffset + levelLength;
    if (finishX > camX - 100 && finishX < camX + W + 100) {
      const barWidth = 50;
      // Pole
      ctx.fillStyle = '#555';
      ctx.fillRect(finishX, 0, 8, H); 
      
      // Checkered Flag Pattern
      for (let y = 0; y < H; y += 25) {
        for(let xOff = 0; xOff < barWidth; xOff += 25) {
            ctx.fillStyle = ((y + xOff) / 25) % 2 === 0 ? '#fff' : '#000';
            ctx.fillRect(finishX + xOff, y, 25, 25);
        }
      }
    }

    // spikes
    for(const s of spikes){ if(s.x + s.w < camX || s.x > camX + W) continue; ctx.fillStyle = '#FF0000'; for(let i=0;i<Math.floor(s.w/12);i++){ ctx.beginPath(); const sx = s.x + 6 + i*12; ctx.moveTo(sx, s.y + s.h); ctx.lineTo(sx+6, s.y); ctx.lineTo(sx+12, s.y + s.h); ctx.fill(); } }

    // comet
    drawComet(player.x, player.y, player.vx, player.vy);

    if(debug){ ctx.fillStyle='#fff'; ctx.font='12px monospace'; ctx.fillText(`pos: ${player.x.toFixed(1)}, ${player.y.toFixed(1)}`, camX+10, 20); ctx.fillText(`vel: ${player.vx.toFixed(1)}, ${player.vy.toFixed(1)}`, camX+10, 36); }

    ctx.restore();
  }

  function drawComet(x,y,vx,vy){ for(let i=0;i<6;i++){ const t = i / 6; ctx.beginPath(); ctx.fillStyle = `rgba(255,220,140,${0.12*(1-t)})`; ctx.ellipse(x - vx * 0.012 * i, y - vy * 0.012 * i, 10*(1-t), 6*(1-t), 0, 0, Math.PI*2); ctx.fill(); } ctx.save(); ctx.beginPath(); ctx.fillStyle = '#ffd89b'; ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,200,120,0.8)'; ctx.ellipse(x, y, player.radius, player.radius, 0, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

})();
</script>
</body>
</html>
